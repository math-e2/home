<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập Toán tương tác - Học sinh</title>
  <style>
    body { font-family: sans-serif; background: #f0f4f8; padding: 20px; max-width: 650px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 16px; }
    .question { border-left: 4px solid #3b82f6; padding-left: 12px; margin-bottom: 20px; transition: transform 0.2s; }
    .question:hover { transform: translateX(4px); }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    input[type="text"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    #login-screen { text-align: center; margin-top: 60px; }
    #quiz-screen { display: none; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
  </style>
</head>
<body>

  <div id="login-screen" class="card">
    <h2>Nhập tên của con để bắt đầu làm bài</h2>
    <input type="text" id="student-name-input" placeholder="Ví dụ: Minh Anh" />
    <button onclick="startQuiz()">Vào làm bài</button>
  </div>

  <div id="quiz-screen">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>Học sinh: <strong id="display-name"></strong></div>
      <span class="badge">● Đang kết nối trực tiếp với cô giáo</span>
    </div>

    <div class="card">
      <div class="question" data-question="1">
        <h3>Câu 1: Kết quả của phép tính 15 × 4 là bao nhiêu?</h3>
        <label><input type="radio" name="q1" value="50" onchange="syncToDashboard('answer_changed', 'Câu 1')"> A. 50</label><br><br>
        <label><input type="radio" name="q1" value="60" onchange="syncToDashboard('answer_changed', 'Câu 1')"> B. 60</label><br><br>
        <label><input type="radio" name="q1" value="45" onchange="syncToDashboard('answer_changed', 'Câu 1')"> C. 45</label>
      </div>

      <div class="question" data-question="2">
        <h3>Câu 2: Điền số thích hợp vào chỗ trống: 120 + ___ = 200</h3>
        <input type="text" id="q2-input" placeholder="Nhập đáp án..." oninput="syncToDashboard('answer_changed', 'Câu 2')" />
      </div>

      <button id="submit-btn" onclick="submitQuiz()">Nộp bài cho cô</button>
      <p id="result-msg" style="font-weight:bold; color:#16a34a;"></p>
    </div>
  </div>

  <script>
    let studentName = '';
    let latestScore = null;
    let latestCorrect = 0;
    let latestWrong = 0;
    let syncTimer = null;

    function buildQuestionsSnapshot() {
      const q1Radios = Array.from(document.querySelectorAll('input[name="q1"]'));
      const q1Checked = q1Radios.find(r => r.checked);
      const q1Options = q1Radios.map(r => ({
        label: r.closest('label')?.innerText?.trim() || r.value,
        checked: r.checked,
        value: r.value
      }));

      const q2Val = (document.getElementById('q2-input')?.value || '').trim();

      const questions = [
        {
          index: 1,
          question: 'Câu 1: Kết quả của phép tính 15 × 4 là bao nhiêu?',
          options: q1Options,
          selected_answers: q1Checked ? [q1Checked.closest('label')?.innerText?.trim() || q1Checked.value] : [],
          input_values: [],
          feedback: latestScore !== null ? (q1Checked?.value === '60' ? 'Đúng (+5đ)' : 'Sai (Đáp án đúng: B. 60)') : null,
          completed: !!q1Checked
        },
        {
          index: 2,
          question: 'Câu 2: Điền số thích hợp vào chỗ trống: 120 + ___ = 200',
          options: [],
          selected_answers: [],
          input_values: [{ label: 'Đáp án', value: q2Val }],
          feedback: latestScore !== null ? (q2Val === '80' ? 'Đúng (+5đ)' : 'Sai (Đáp án đúng: 80)') : null,
          completed: q2Val !== ''
        }
      ];

      const completedCount = questions.filter(q => q.completed).length;
      return {
        questions,
        total_questions: questions.length,
        completed_questions: completedCount,
        progress: Math.round((completedCount / questions.length) * 100)
      };
    }

    function syncToDashboard(status = 'in_progress', currentQ = 'Câu 1', immediate = false) {
      const send = () => {
        const snap = buildQuestionsSnapshot();
        window.parent.postMessage({
          type: 'MATH6_LIVE_STATE',
          session_status: status,
          current_screen: 'exercise_screen',
          current_question: currentQ,
          total_questions: snap.total_questions,
          completed_questions: snap.completed_questions,
          correct_count: latestCorrect,
          wrong_count: latestWrong,
          score: latestScore,
          max_score: 10,
          progress: snap.progress,
          current_answers: snap.questions,
          interaction_state: {
            exercise_title: 'Bài tập Toán tương tác',
            questions: snap.questions,
            updated_at: new Date().toISOString()
          }
        }, '*');
      };

      clearTimeout(syncTimer);
      if (immediate) send();
      else syncTimer = setTimeout(send, 200);
    }

    function startQuiz() {
      const input = document.getElementById('student-name-input').value.trim();
      if (!input) return alert('Con hãy nhập tên trước nhé!');
      studentName = input;

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      document.getElementById('display-name').innerText = studentName;

      // Gửi ngay toàn bộ đề bài lên Dashboard giáo viên
      syncToDashboard('in_progress', 'Câu 1', true);
    }

    function submitQuiz() {
      const q1 = document.querySelector('input[name="q1"]:checked')?.value || '';
      const q2 = document.getElementById('q2-input').value.trim();

      let score = 0;
      let correct = 0;
      if (q1 === '60') { score += 5; correct++; }
      if (q2 === '80') { score += 5; correct++; }

      latestScore = score;
      latestCorrect = correct;
      latestWrong = 2 - correct;

      document.getElementById('submit-btn').disabled = true;
      document.getElementById('result-msg').innerText = `Đã nộp bài thành công! Điểm của con: ${score}/10`;

      // Đồng bộ kết quả chấm và điểm số thực tế ra Dashboard
      syncToDashboard('submitted', 'Hoàn thành', true);
    }
  </script>
</body>
</html>
